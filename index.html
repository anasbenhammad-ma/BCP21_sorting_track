<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorting BCP21</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- SheetJS for reading Excel files -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">Sorting BCP21</h1>
        <p id="db-status" class="text-sm mt-1 text-blue-200">Loading databases...</p>
    </header>

    <!-- Main Scanner Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        <div id="reader-container" class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden border-2 border-gray-200">
            <div id="reader" class="w-full"></div>
        </div>
        <p class="text-gray-500 mt-4 text-sm text-center font-medium">Point camera at QR code to scan.<br>Extracts the last 10 characters.</p>
        
        <!-- Admin Access -->
        <div class="mt-8">
            <button onclick="showAdmin()" class="flex items-center justify-center gap-2 bg-white border-2 border-gray-300 text-gray-700 px-6 py-3 rounded-full shadow-sm hover:shadow-lg hover:bg-gray-50 hover:border-gray-400 active:scale-95 transition-all duration-200 cursor-pointer focus:outline-none focus:ring-4 focus:ring-gray-200 font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                Admin / History
            </button>
        </div>
    </main>

    <!-- Full Screen Result Overlay -->
    <div id="result-overlay" class="fixed inset-0 hidden flex-col items-center justify-center z-50 p-6 text-center">
        <h2 id="result-title" class="text-6xl font-extrabold text-white mb-6 shadow-sm tracking-wide"></h2>
        <div class="bg-white p-6 rounded-2xl shadow-2xl mb-12 w-full max-w-xs border-4 border-white/50">
            <p class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-2">Scanned Serial (Last 10):</p>
            <p id="result-serial" class="text-3xl font-mono font-black text-gray-900 tracking-widest"></p>
            <div class="mt-4 pt-3 border-t border-gray-100">
                <p id="full-scan" class="text-xs text-gray-400 truncate"></p>
            </div>
        </div>
        <button onclick="resetScanner()" class="flex items-center justify-center gap-3 bg-white text-gray-900 font-black py-5 px-10 rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.3)] text-2xl hover:bg-gray-100 hover:shadow-[0_0_30px_rgba(255,255,255,0.8)] active:scale-90 transition-all duration-200 cursor-pointer focus:outline-none focus:ring-8 focus:ring-white/50 border-4 border-transparent hover:border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            SCAN NEXT PART
        </button>
    </div>

    <!-- Admin Panel Overlay -->
    <div id="admin-overlay" class="fixed inset-0 hidden flex-col items-center justify-center z-50 bg-gray-900/50 backdrop-blur-sm p-4">
        <div class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-6 flex flex-col h-[85vh] border-t-8 border-blue-600">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-extrabold text-gray-900">Admin Panel</h2>
                <button onclick="hideAdmin()" class="bg-red-100 text-red-700 px-5 py-2 rounded-lg font-bold hover:bg-red-200 hover:shadow-md active:scale-95 transition-all duration-200 cursor-pointer focus:outline-none focus:ring-4 focus:ring-red-200 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    Close
                </button>
            </div>
            
            <div class="flex gap-4 mb-6">
                <button onclick="downloadHistory()" class="flex items-center justify-center gap-2 bg-blue-600 text-white font-bold px-6 py-4 rounded-xl shadow-lg hover:bg-blue-700 hover:shadow-xl active:scale-95 transition-all duration-200 cursor-pointer focus:outline-none focus:ring-4 focus:ring-blue-300 w-full text-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Download Scan History (CSV)
                </button>
            </div>
            
            <div class="flex-grow overflow-auto border-2 border-gray-200 rounded-xl shadow-inner bg-gray-50">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-200 sticky top-0 shadow-sm">
                        <tr>
                            <th class="p-3 border-b-2 border-gray-300 font-bold text-gray-700">Time</th>
                            <th class="p-3 border-b-2 border-gray-300 font-bold text-gray-700">Serial</th>
                            <th class="p-3 border-b-2 border-gray-300 font-bold text-gray-700">Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body" class="bg-white divide-y divide-gray-100">
                        <!-- History rows will be generated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let html5QrcodeScanner;
        
        // Data stores for fast lookup
        const okParts = new Set();
        const nokParts = new Set();
        
        // Data store for scan history
        const scanHistory = [];

        // Initialize Scanner
        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: {width: 250, height: 250} },
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        // Handle successful scan
        function onScanSuccess(decodedText) {
            // Pause scanner so it doesn't keep scanning
            html5QrcodeScanner.pause(true);

            // Clean the text and extract the last 10 characters safely
            const cleanText = decodedText.trim();
            const serialNumber = cleanText.slice(-10);
            
            // Determine status
            let status = "NOT INCLUDED";
            if (okParts.has(serialNumber)) status = "OK";
            else if (nokParts.has(serialNumber)) status = "NOK";
            
            // Record history
            scanHistory.push({
                serial: serialNumber,
                fullText: cleanText,
                status: status,
                time: new Date().toLocaleString()
            });
            
            showResult(serialNumber, cleanText, status);
        }

        function onScanFailure(error) {
            // Ignore continuous scan failures
        }

        // Show Full Screen Result
        function showResult(serial, fullText, status) {
            const overlay = document.getElementById('result-overlay');
            const title = document.getElementById('result-title');
            const serialDisplay = document.getElementById('result-serial');
            const fullScanDisplay = document.getElementById('full-scan');

            serialDisplay.textContent = serial;
            fullScanDisplay.textContent = "Full: " + fullText;

            // Remove previous color classes
            overlay.classList.remove('bg-green-500', 'bg-red-600', 'bg-yellow-500');

            if (status === "OK") {
                overlay.classList.add('bg-green-500');
                title.textContent = "OK";
            } else if (status === "NOK") {
                overlay.classList.add('bg-red-600');
                title.textContent = "NOK";
            } else {
                overlay.classList.add('bg-yellow-500');
                title.textContent = "NOT INCLUDED";
            }

            // Display the overlay
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        // Hide overlay and resume scanner
        function resetScanner() {
            const overlay = document.getElementById('result-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            
            if (html5QrcodeScanner) {
                html5QrcodeScanner.resume();
            }
        }

        // Fetch and parse Excel file from the same directory (GitHub repo)
        async function fetchExcelData(filename, targetSet) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error("File not found");
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Convert to array of arrays
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                // Add every cell to the Set (forcing it to a trimmed string)
                jsonData.forEach(row => {
                    row.forEach(cell => {
                        if (cell !== null && cell !== undefined) {
                            targetSet.add(String(cell).trim());
                        }
                    });
                });
                return true;
            } catch (error) {
                console.error(`Error loading ${filename}:`, error);
                return false;
            }
        }

        // Load both files on startup
        async function loadDatabases() {
            const statusEl = document.getElementById('db-status');
            
            // Fetch both files simultaneously
            const [okLoaded, nokLoaded] = await Promise.all([
                fetchExcelData('ok_parts.xlsx', okParts),
                fetchExcelData('nok_parts.xlsx', nokParts)
            ]);

            if (okLoaded && nokLoaded) {
                statusEl.textContent = `Ready: ${okParts.size} OK | ${nokParts.size} NOK`;
            } else {
                statusEl.textContent = "Error loading database files!";
                statusEl.classList.replace('text-blue-200', 'text-red-200');
                statusEl.classList.add('font-bold');
            }
        }
        
        // Admin Panel Logic
        function showAdmin() {
            const pin = prompt("Enter Admin PIN:");
            if (pin === "1234") {
                document.getElementById('admin-overlay').classList.remove('hidden');
                document.getElementById('admin-overlay').classList.add('flex');
                renderHistory();
                if (html5QrcodeScanner) html5QrcodeScanner.pause(true);
            } else if (pin !== null) {
                alert("Incorrect PIN");
            }
        }

        function hideAdmin() {
            document.getElementById('admin-overlay').classList.add('hidden');
            document.getElementById('admin-overlay').classList.remove('flex');
            if (html5QrcodeScanner) html5QrcodeScanner.resume();
        }

        function renderHistory() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '';
            
            // Show latest first
            const reversedHistory = [...scanHistory].reverse();
            
            if (reversedHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-6 text-center text-gray-500 font-medium">No scans recorded yet. Start scanning to see history!</td></tr>';
                return;
            }
            
            reversedHistory.forEach(record => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                
                let statusColor = "text-yellow-600 bg-yellow-50 px-2 py-1 rounded border border-yellow-200";
                if (record.status === "OK") statusColor = "text-green-700 bg-green-50 px-2 py-1 rounded border border-green-200 font-bold";
                if (record.status === "NOK") statusColor = "text-red-700 bg-red-50 px-2 py-1 rounded border border-red-200 font-bold";
                
                tr.innerHTML = `
                    <td class="p-3 whitespace-nowrap text-gray-600">${record.time}</td>
                    <td class="p-3 font-mono text-gray-900 font-semibold tracking-wide">${record.serial}</td>
                    <td class="p-3"><span class="${statusColor}">${record.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function downloadHistory() {
            if (scanHistory.length === 0) {
                alert("No history to download.");
                return;
            }
            
            let csvContent = "Time,Serial,Full Scan Text,Status\n";
            scanHistory.forEach(r => {
                // Escape commas in full text just in case
                const cleanFullText = r.fullText.replace(/,/g, " ");
                csvContent += `${r.time},${r.serial},${cleanFullText},${r.status}\n`;
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Sorting_BCP21_History_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Start everything when page loads
        window.onload = () => {
            initScanner();
            loadDatabases();
        };
    </script>
</body>
</html>
